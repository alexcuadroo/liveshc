<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#120d0c" />
    <meta
      name="description"
      content="Estado en vivo de los jugadores de LivesHC"
    />
    <title>Duelo de supervivencia | LivesHC</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#duelo">Saltar al duelo</a>
    <main id="duelo" tabindex="-1">
      <h1>Dos jugadores.<br /><em>Y... muchos intentos.</em></h1>

      <div class="match-status" aria-label="Estado de la partida">
        <section class="attempt-record" aria-labelledby="attempt-title">
          <div class="attempt-copy">
            <span class="attempt-label" id="attempt-title"
              >Intento hardcore</span
            >
            <span class="attempt-caption"
              >veces que el mundo puso a prueba al equipo</span
            >
          </div>
          <output class="attempt-number" id="attempt-number" aria-live="polite"
            >—</output
          >
        </section>

        <section
          class="shared-lives"
          id="shared-lives"
          aria-labelledby="shared-lives-title"
          hidden
        >
          <div class="shared-copy">
            <span class="shared-kicker">Modo cooperativo</span>
            <h2 id="shared-lives-title">Vidas restantes</h2>
            <div
              class="shared-hearts"
              id="shared-hearts"
              aria-hidden="true"
            ></div>
          </div>
          <output
            class="shared-count"
            id="shared-count"
            aria-label="Vidas compartidas restantes"
            >—</output
          >
        </section>
      </div>

      <section class="arena" aria-labelledby="arena-title">
        <h2 id="arena-title" class="visually-hidden">Jugadores enfrentados</h2>
        <article
          class="fighter fighter-one"
          id="player-0"
          aria-busy="true"
        ></article>
        <div class="versus" aria-hidden="true">
          <span>V</span><span>S</span>
        </div>
        <article
          class="fighter fighter-two"
          id="player-1"
          aria-busy="true"
        ></article>
      </section>
    </main>

    <footer>
      <div class="footer-branding">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">♥</span> LivesHC
        </div>
        <a
          class="github-link"
          href="https://github.com/alexcuadroo/liveshc"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Ver el plugin LivesHC en GitHub"
        >
          <svg aria-hidden="true" viewBox="-1 -1 18 18" focusable="false">
            <path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.49c-2.23.49-2.7-1.08-2.7-1.08-.36-.93-.89-1.18-.89-1.18-.73-.5.06-.49.06-.49.81.06 1.23.83 1.23.83.72 1.23 1.89.88 2.35.67.07-.52.28-.88.51-1.08-1.78-.2-3.65-.89-3.65-3.96 0-.88.31-1.59.83-2.15-.08-.2-.36-1.02.08-2.12 0 0 .68-.22 2.2.82A7.65 7.65 0 0 1 8 4.8c.68 0 1.36.09 2 .27 1.52-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.52.56.83 1.27.83 2.15 0 3.08-1.88 3.76-3.66 3.96.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z" />
          </svg>
          <span>GitHub</span>
        </a>
      </div>
      <time id="last-update">Sin datos todavía</time>
    </footer>
    <div
      class="visually-hidden"
      id="announcer"
      aria-live="polite"
      aria-atomic="true"
    ></div>
  </body>
</html>
