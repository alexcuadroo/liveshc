<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#120d0c" />
    <meta
      name="description"
      content="Estado en vivo de los jugadores de LivesHC"
    />
    <title>Supervivencia cooperativa | LivesHC</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=3" />
    <script src="/app.js?v=3" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#duelo">Saltar al equipo</a>
    <main id="duelo" tabindex="-1" data-display-mode="coop">
      <p class="eyebrow" id="mode-eyebrow">Supervivencia cooperativa</p>
      <h1 id="page-title">Un equipo.<br /><em>Y... muchos intentos.</em></h1>

      <div class="match-status" aria-label="Estado de la partida">
        <section class="attempt-record" aria-labelledby="attempt-title">
          <div class="attempt-copy">
            <span class="attempt-label" id="attempt-title"
              >Intento hardcore</span
            >
            <span class="attempt-caption" id="attempt-caption"
              >veces que el mundo puso a prueba al equipo</span
            >
          </div>
          <output class="attempt-number" id="attempt-number" aria-live="polite"
            >—</output
          >
        </section>

        <section
          class="shared-lives"
          id="shared-lives"
          aria-labelledby="shared-lives-title"
          hidden
        >
          <div class="shared-copy">
            <span class="shared-kicker">Modo cooperativo</span>
            <h2 id="shared-lives-title">Vidas restantes</h2>
            <div
              class="shared-hearts"
              id="shared-hearts"
              aria-hidden="true"
            ></div>
          </div>
          <output
            class="shared-count"
            id="shared-count"
            aria-label="Vidas compartidas restantes"
            >—</output
          >
        </section>
      </div>

      <section class="roster" aria-labelledby="arena-title">
        <h2 id="arena-title" class="visually-hidden">Equipo</h2>
        <div class="arena" id="arena"></div>
      </section>
    </main>

    <footer>
      <div class="footer-branding">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">♥</span> LivesHC
        </div>
        <a
          class="github-link"
          href="https://github.com/alexcuadroo/liveshc"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Ver el plugin LivesHC en GitHub"
        >
          <svg aria-hidden="true" focusable="false" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg>
          <span>GitHub</span>
        </a>
      </div>
      <time id="last-update">Sin datos todavía</time>
    </footer>
    <div
      class="visually-hidden"
      id="announcer"
      aria-live="polite"
      aria-atomic="true"
    ></div>
  </body>
</html>
