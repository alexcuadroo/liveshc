name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar versión y tag
        id: vars
        run: |
          GRADLE_VERSION="$(grep -E '^[[:space:]]*version[[:space:]]*=' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          TARGET_TAG="v.${GRADLE_VERSION}"
          echo "version=${GRADLE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "Versión detectada en Gradle: ${GRADLE_VERSION} -> Tag: ${TARGET_TAG}"

      - name: Asegurar tag en el repositorio
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "El tag $TAG ya existe local o remotamente."
          else
            echo "Creando tag $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar plugin
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain

      - name: Publicar release con el .jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/libs/*.jar
