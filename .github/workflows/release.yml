name: Release

on:
  push:
    tags:
      - 'v.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que el tag coincide con la versión del plugin
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          TAG_VERSION="${TAG_VERSION#.}"
          GRADLE_VERSION="$(grep -E '^[[:space:]]*version[[:space:]]*=' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          PLUGIN_VERSION="$(grep -E "^version:" src/main/resources/plugin.yml | head -n1 | sed -E "s/.*'([^']+)'.*/\1/")"
          echo "Tag: $TAG -> $TAG_VERSION | Gradle: $GRADLE_VERSION | plugin.yml: $PLUGIN_VERSION"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ] || [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::El tag $TAG no coincide con build.gradle.kts ($GRADLE_VERSION) y plugin.yml ($PLUGIN_VERSION). Usa el mismo número en los tres, ej. tag v.1.3.0 para versión 1.3.0."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar plugin
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain

      - name: Publicar release con el .jar
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/libs/*.jar
