name: LivesHC
version: '${version}'
main: dev.alexc.liveshc.Main
description: Gestiona las vidas de los jugadores y ejecuta una acción al agotarlas.
api-version: '26.1'
author: alexc
softdepend: [PlaceholderAPI]

commands:
  liveshc:
    description: Comandos administrativos de LivesHC.
    usage: /liveshc reload o /liveshc add <jugador> <cantidad>

permissions:
  liveshc.reload:
    description: Permite recargar la configuración de LivesHC.
    default: op
  liveshc.add:
    description: Permite añadir vidas a un jugador conectado.
    default: op
  hardcoresounds.use:
    description: Permite usar los comandos de sonidos.
    default: op
  hardcoresounds.play:
    default: op
  hardcoresounds.play.others:
    default: op
  hardcoresounds.play.all:
    default: op
  hardcoresounds.stop:
    default: op
  hardcoresounds.reload:
    default: op
  hardcoresounds.admin:
    default: op
    children:
      hardcoresounds.use: true
      hardcoresounds.play: true
      hardcoresounds.play.others: true
      hardcoresounds.play.all: true
      hardcoresounds.stop: true
      hardcoresounds.reload: true
