# Vidas que recibe un jugador la primera vez que entra al servidor.
vidas-iniciales: 3

# Límite máximo de vidas que puede tener cualquier jugador.
vidas-maximas: 5

# Si es true, todos los jugadores usan un único contador de vidas.
# Si es false, cada UUID conserva su propio contador.
# No confundir con "modo": esto afecta a la lógica de vidas.
vidas-compartidas: false

# Modo de presentación para la web: "solo" (1 jugador) o "coop" (equipo de 2).
# No afecta a las vidas, solo al título y a cómo la web muestra las skins.
# La web lee este valor desde cada snapshot enviado por el plugin.
modo: coop

# Se ejecuta desde la consola cuando un jugador pasa de una vida a cero.
# %player% se sustituye por el nombre del jugador. No es necesario escribir "/".
comando-sin-vidas: "gamemode spectator %player%"

# Segundos de espera entre la muerte y la ejecución del comando.
# Usa 0 para ejecutarlo inmediatamente.
delay-comando-segundos: 0

# HUD mostrado en cualquier muerte. En PvP lo reciben atacante y víctima;
# en muertes ambientales lo recibe la víctima con un indicador de entorno.
# Requiere el resource pack de HardcoreSounds que incluye assets/liveshc.
hud-muerte:
  habilitado: true
  fade-in-ticks: 5
  duracion-ticks: 160
  fade-out-ticks: 10

# Sincronización opcional con la web pública. El plugin sigue funcionando y
# guardando las vidas en players.yml aunque la API no esté disponible.
web:
  habilitada: false
  api-url: "https://tu-dominio.example/internal/v1/snapshot"
  token: "cambia-este-token"
  server-id: "principal"
  intervalo-segundos: 30
